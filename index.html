function _call(fn,args){return fetch(KJ_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow'}).then(function(r){return r.json();});}
function _mk(ok,fail){return new Proxy({},{get:function(_,k){if(k==='withSuccessHandler')return function(f){return _mk(f,fail);};if(k==='withFailureHandler')return function(f){return _mk(ok,f);};
return function(){var a=Array.prototype.slice.call(arguments);_call(k,a).then(function(j){if(j.error){fail&&fail(new Error(j.error));}else{ok&&ok(j.result);}}).catch(function(){fail&&fail(new Error('Koneksi gagal. Periksa internet lalu coba lagi.'));});};}});}
window.google={script:{run:_mk(null,null)}};
</script>

<style>
:root{
  --bg:#fbf7f0; --bg2:#f4ece0; --card:#ffffff; --ink:#2b1a10; --muted:#6b5444; --line:#e6d9c6;
  --gold:#e9a82b; --gold-soft:#fdf3df; --red:#b8321c; --red-soft:#fbe3dd; --green:#1f6b5c; --green-soft:#e5f2ee;
  --blue:#22476f; --blue-soft:#e2ecf6; --shadow:0 6px 20px rgba(43,26,16,.09); --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;font-size:16px;line-height:1.45}
body{min-height:100vh}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
a{color:var(--red)}
.serif{font-family:'Playfair Display',Georgia,serif}
.wrap{max-width:560px;margin:0 auto;position:relative;min-height:100vh}
.wide .wrap{max-width:980px}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}.xs{font-size:13px}
.b{font-weight:700}.xb{font-weight:800}
.price{color:var(--red);font-weight:800}
.pad{padding:18px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.kicker{font-size:13px;font-weight:700;letter-spacing:2px;color:#8a6420;text-transform:uppercase}
h1,h2,h3{margin:0}
.h-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700}

/* buttons */
.btn{height:58px;border-radius:16px;border:none;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 20px;text-decoration:none;width:100%;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-dark{background:var(--ink);color:#fff}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-green{background:var(--green);color:#fff}
.btn-line{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn-soft{background:var(--bg2);color:var(--ink)}
.btn-sm{height:44px;font-size:15px;border-radius:12px;width:auto;padding:0 16px}
.iconbtn{width:48px;height:48px;border-radius:50%;border:none;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex:none}

/* form */
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.lbl{font-size:16px;font-weight:700}
.inp{height:58px;border:1.5px solid var(--line);border-radius:14px;padding:0 16px;font-size:18px;background:#fff;width:100%;outline:none;transition:border .15s,box-shadow .15s}
textarea.inp{height:auto;min-height:100px;padding:14px 16px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(233,168,43,.25)}
.inp.err{border-color:var(--red);box-shadow:0 0 0 4px rgba(184,50,28,.12)}
.upper{text-transform:uppercase}
input[type=search]::-webkit-search-cancel-button{display:none}
input::placeholder,textarea::placeholder{text-transform:none;color:#a89886}
.hint{font-size:14px;color:var(--muted)}
.errmsg{font-size:14px;color:var(--red);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{height:64px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:17px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.picker{height:58px;border:1.5px solid var(--line);border-radius:14px;padding:0 16px;font-size:17px;background:#fff;width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left}
.picker.empty{color:#9a8a7a}
.picker[disabled]{background:#f7f2ea;border-style:dashed;color:#b0a090}
.picker .ph{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;border-radius:21px;border:1.5px solid var(--line);background:#fff;padding:0 16px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.badge{display:inline-flex;align-items:center;border-radius:12px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}

/* stepper */
.stepper{display:flex;align-items:center;gap:4px;background:var(--bg2);border-radius:30px;padding:4px}
.stepper button{width:48px;height:48px;border-radius:50%;border:none;background:#fff;font-size:24px;font-weight:700;line-height:1}
.stepper button.plus{background:var(--ink);color:#fff}
.stepper .q{min-width:34px;text-align:center;font-size:20px;font-weight:800}

/* sheet / modal */
.sheet-bg{position:fixed;inset:0;background:rgba(30,18,10,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
.sheet-head{padding:16px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f1e7d8}
.sheet-body{overflow:auto;padding:12px 18px 24px}
.opt{width:100%;text-align:left;padding:16px 14px;font-size:17px;border:none;background:#fff;border-bottom:1px solid #f3eadc;display:flex;justify-content:space-between;gap:10px}
.opt:active,.opt:hover{background:var(--gold-soft)}
.opt mark{background:none;color:inherit;text-decoration:underline;font-weight:800}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* toast & loader */
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 20px;border-radius:14px;font-size:15px;font-weight:600;z-index:90;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.err{background:var(--red)}
.loading{position:fixed;inset:0;background:rgba(251,247,240,.75);z-index:80;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-weight:700}
.spin{width:44px;height:44px;border:4px solid var(--bg2);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#efe6d8 25%,#f7f1e7 50%,#efe6d8 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:20px}
@keyframes sk{to{background-position:-200% 0}}

/* header */
.hero{background:var(--ink);color:#fff;padding:18px 20px 26px;border-radius:0 0 28px 28px}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #efe4d3;padding:14px 18px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff}

/* timeline */
.tl{display:flex;gap:14px}
.tl .dotcol{display:flex;flex-direction:column;align-items:center}
.tl .dot{width:28px;height:28px;border-radius:50%;border:3px solid #d8c7ae;background:#fff;flex:none}
.tl .dot.done{background:var(--green);border-color:var(--green)}
.tl .dot.now{background:var(--gold);border-color:var(--gold)}
.tl .line{width:3px;flex:1;min-height:26px;background:#e6dccd}
.tl .line.done{background:var(--green)}

@media (min-width:700px){
  .h-title{font-size:30px}
}
</style>

<style>
.pcard{background:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.pimg{position:relative;aspect-ratio:4/3;background:var(--bg2)}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg .toko{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.95);font-size:12.5px;font-weight:700;letter-spacing:1px;border-radius:14px;padding:5px 12px}
.pimg .habis{position:absolute;inset:0;background:rgba(30,18,10,.6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:3px;font-size:24px}
.pbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.pname{font-size:20px;font-weight:700;line-height:1.25}
.pprice{font-size:24px;font-weight:800;color:var(--red)}
.incart{background:var(--green-soft);color:#1a5a4e;border-radius:12px;padding:10px 12px;font-size:14.5px;font-weight:600}
.searchbar{position:sticky;top:0;z-index:15;background:var(--bg);padding:12px 18px 10px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox .inp{padding-left:50px;padding-right:52px;border-radius:30px;background:#fff;box-shadow:var(--shadow);border-color:transparent}
.searchbox .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:46px;height:46px}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:calc(100% - 24px);max-width:536px;background:var(--ink);color:#fff;border-radius:22px;padding:12px 12px 12px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 32px rgba(43,26,16,.35);z-index:30}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (min-width:900px){body.katalog .wrap{max-width:1080px}body.katalog #plist{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}body.katalog .searchbar{max-width:640px}}
@media print{.noprint{display:none!important}body,html{background:#fff}.notacard{box-shadow:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="pad"><div class="skel" style="height:220px;margin-bottom:16px"></div><div class="skel" style="height:320px"></div></div></div>
<div id="toast"></div>
<script>
/* ---------- panggil server ---------- */
function api(name) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) {
      rej(new Error(String((e && e.message) || e).replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '')));
    });
    r[name].apply(r, args);
  });
}

/* ---------- util ---------- */
function $(s, el) { return (el || document).querySelector(s); }
function $$(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function rp(n) { return 'Rp' + String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function rpPlain(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function wa62(d) { return '62' + String(d || '').replace(/\D/g, '').replace(/^0/, ''); }
function waLink(no, text) { return 'https://wa.me/' + wa62(no) + (text ? '?text=' + encodeURIComponent(text) : ''); }
function openUrl(u) { var w = window.open(u, '_blank'); if (!w) window.top.location.href = u; }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('kj_' + k)); localStorage.setItem('kj_' + k, JSON.stringify(v)); } catch (e) { return null; } }

var toastT;
function toast(msg, isErr) {
  var t = $('#toast'); t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(function () { t.className = ''; }, isErr ? 4200 : 2600);
}
function loading(on, text) {
  var el = $('#loadingBox');
  if (on) {
    if (!el) { el = document.createElement('div'); el.id = 'loadingBox'; el.className = 'loading'; document.body.appendChild(el); }
    el.innerHTML = '<div class="spin"></div><div>' + esc(text || 'Mohon tunggu…') + '</div>';
  } else if (el) el.remove();
}
function copyText(t) {
  function fb() {
    var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(fb); else fb();
  toast('Tersalin ✓');
}

/* ---------- input rapi: kapital & angka ---------- */
function bindUpper(el) {
  el.classList.add('upper');
  el.addEventListener('input', function () {
    var s = el.selectionStart, e = el.selectionEnd, v = el.value.toUpperCase();
    if (v !== el.value) { el.value = v; try { el.setSelectionRange(s, e); } catch (x) {} }
  });
}
function bindDigits(el, onBad) {
  el.setAttribute('inputmode', 'numeric');
  el.addEventListener('input', function () {
    var v = el.value, d = v.replace(/\D/g, '');
    if (v !== d) { el.value = d; if (onBad) onBad(); }
  });
}
function bindRupiah(el) {
  el.setAttribute('inputmode', 'numeric');
  el.addEventListener('input', function () {
    var d = el.value.replace(/\D/g, '');
    el.value = d ? rpPlain(d) : '';
  });
}
function digits(v) { return Number(String(v || '').replace(/\D/g, '')) || 0; }
function normWa(v) {
  var d = String(v || '').replace(/\D/g, '');
  if (d.indexOf('62') === 0) d = '0' + d.slice(2); else if (d.indexOf('8') === 0) d = '0' + d;
  return /^08\d{8,11}$/.test(d) ? d : '';
}

/* ---------- foto: perkecil sebelum upload ---------- */
function readImage(file, maxSide, quality) {
  return new Promise(function (res, rej) {
    if (!file) return rej(new Error('Tidak ada file'));
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, (maxSide || 1200) / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', quality || 0.82));
      };
      img.onerror = function () { rej(new Error('Gambar tidak bisa dibaca')); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- bottom sheet pencarian ---------- */
function searchSheet(opts) {
  // opts: {title, items:[{value,label,sub}], loader:Promise, onPick, placeholder}
  var bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" role="dialog" aria-label="' + esc(opts.title) + '">' +
    '<div class="sheet-head"><div class="grow"><div class="kicker">Pilih</div><div class="h-title" style="font-size:22px">' + esc(opts.title) + '</div></div>' +
    '<button class="iconbtn" aria-label="Tutup" data-x>' + ICON.x + '</button></div>' +
    '<div style="padding:12px 18px 6px"><input class="inp" type="search" autocomplete="off" placeholder="' + esc(opts.placeholder || 'Ketik untuk mencari…') + '"></div>' +
    '<div class="sheet-body" style="padding-top:0"><div class="list"><div class="pad muted">Memuat…</div></div></div></div>';
  document.body.appendChild(bg);
  var inp = $('input', bg), list = $('.list', bg), items = [];
  function close() { bg.remove(); }
  bg.addEventListener('click', function (e) { if (e.target === bg || e.target.closest('[data-x]')) close(); });
  function render() {
    var q = inp.value.trim().toUpperCase();
    var f = items.filter(function (it) { return !q || it.label.toUpperCase().indexOf(q) >= 0; });
    f.sort(function (a, b) {
      var A = a.label.toUpperCase().indexOf(q) === 0 ? 0 : 1, B = b.label.toUpperCase().indexOf(q) === 0 ? 0 : 1; return A - B;
    });
    if (!f.length) { list.innerHTML = '<div class="pad muted">Tidak ditemukan. Coba ketik kata lain.</div>'; return; }
    list.innerHTML = f.slice(0, 300).map(function (it, i) {
      var L = esc(it.label);
      if (q) { var k = it.label.toUpperCase().indexOf(q); if (k >= 0) L = esc(it.label.slice(0, k)) + '<mark>' + esc(it.label.slice(k, k + q.length)) + '</mark>' + esc(it.label.slice(k + q.length)); }
      return '<button class="opt" data-i="' + items.indexOf(it) + '"><span>' + L + '</span>' + (it.sub ? '<span class="muted small">' + esc(it.sub) + '</span>' : '') + '</button>';
    }).join('');
  }
  inp.addEventListener('input', render);
  list.addEventListener('click', function (e) {
    var b = e.target.closest('.opt'); if (!b) return;
    close(); opts.onPick(items[Number(b.getAttribute('data-i'))]);
  });
  bindUpper(inp);
  Promise.resolve(opts.loader || opts.items).then(function (r) { items = r || []; render(); setTimeout(function () { inp.focus(); }, 60); })
    .catch(function (e) { list.innerHTML = '<div class="pad errmsg">' + esc(e.message) + '</div>'; });
}

/* ---------- pemilih wilayah bertingkat ---------- */
var WIL_CACHE = {};
function wilayah(induk) {
  var k = induk || 'ROOT';
  if (!WIL_CACHE[k]) WIL_CACHE[k] = api('apiWilayah', induk || '').then(function (r) {
    return r.map(function (x) { return { value: x[0], label: x[1], kodepos: x[2] }; });
  }).catch(function (e) { delete WIL_CACHE[k]; throw e; });
  return WIL_CACHE[k];
}
function WilayahPicker(host, initial) {
  var LV = [['prov', 'Provinsi'], ['kota', 'Kota / Kabupaten'], ['kec', 'Kecamatan'], ['kel', 'Kelurahan / Desa']];
  var st = { prov: null, kota: null, kec: null, kel: null, detail: '' };
  if (initial) LV.forEach(function (l) { if (initial[l[0]]) st[l[0]] = { label: initial[l[0]], value: null }; });
  if (initial) { st.detail = initial.detail || ''; st.kodepos = initial.kodepos || ''; }
  host.innerHTML = LV.map(function (l, i) {
    return '<div class="field"><div class="lbl">' + (i + 1) + '. ' + l[1] + '</div><button type="button" class="picker" data-lv="' + l[0] + '"><span class="ph"></span>' + ICON.down + '</button></div>';
  }).join('') +
    '<div class="between" style="background:var(--bg2);border-radius:12px;padding:12px 16px"><span class="b">Kode Pos</span><span class="xb kp" style="font-size:18px"></span></div>' +
    '<div class="field"><label class="lbl">5. Alamat Detail</label><textarea class="inp det" rows="3" placeholder="NAMA JALAN, NO. RUMAH, RT/RW, PATOKAN"></textarea><div class="hint">Contoh: JL. MAWAR NO. 12, RT 03/RW 05, DEKAT MASJID</div></div>';
  var det = $('.det', host); det.value = st.detail; bindUpper(det);
  det.addEventListener('input', function () { st.detail = det.value; });
  function parentOf(i) { return i === 0 ? '' : (st[LV[i - 1][0]] || {}).value; }
  function paint() {
    LV.forEach(function (l, i) {
      var b = $('[data-lv="' + l[0] + '"]', host), v = st[l[0]];
      var enabled = i === 0 || (st[LV[i - 1][0]] && (st[LV[i - 1][0]].value || v));
      b.disabled = !enabled;
      b.classList.toggle('empty', !v);
      $('.ph', b).textContent = v ? v.label : (enabled ? 'Ketuk untuk pilih' : 'Pilih ' + LV[i - 1][1].toLowerCase() + ' dulu');
    });
    $('.kp', host).textContent = st.kodepos || 'otomatis';
    $('.kp', host).style.color = st.kodepos ? 'var(--ink)' : '#9a8a7a';
  }
  host.addEventListener('click', function (e) {
    var b = e.target.closest('.picker'); if (!b || b.disabled) return;
    var lv = b.getAttribute('data-lv'), i = LV.map(function (l) { return l[0]; }).indexOf(lv);
    var par = parentOf(i);
    var p = (i > 0 && !par) ? Promise.reject(new Error('Pilih ulang ' + LV[i - 1][1].toLowerCase() + ' dulu ya.')) : wilayah(par);
    searchSheet({
      title: LV[i][1], loader: p, placeholder: 'Ketik huruf awal…',
      onPick: function (it) {
        st[lv] = it;
        for (var j = i + 1; j < LV.length; j++) st[LV[j][0]] = null;
        st.kodepos = lv === 'kel' ? it.kodepos : '';
        paint();

var D = null;          // data katalog
var CART = store('cart') || {};   // key "id|varian" -> {id,varian,qty}
var SEL = {};          // varian terpilih per produk
var Q = '';            // kata pencarian
var app = $('#app');
function logo() { return (D && D.toko && D.toko.logo) || KJ_LOGO_DEFAULT; }
function saveCart() { store('cart', CART); }
function recent(add) {
  var r = store('recent') || [];
  if (add) { r = r.filter(function (x) { return x.token !== add.token; }); r.unshift(add); r = r.slice(0, 5); store('recent', r); }
  return r;
}
function scrollTop() { window.scrollTo(0, 0); document.body.classList.remove('katalog'); }

/* =================== KATALOG =================== */
function loadKatalog() {
  return api('apiKatalog').then(function (r) {
    D = r;
    var ids = {}; (D.produk || []).forEach(function (p) { ids[p.id] = p; });
    Object.keys(CART).forEach(function (k) { if (!ids[CART[k].id]) delete CART[k]; });
    saveCart();
  });
}
function prodById(id) { return (D.produk || []).filter(function (p) { return p.id === id; })[0]; }
function qtyOf(id) { var n = 0; Object.keys(CART).forEach(function (k) { if (CART[k].id === id) n += CART[k].qty; }); return n; }
function cartSum() {
  var n = 0, t = 0;
  Object.keys(CART).forEach(function (k) { var p = prodById(CART[k].id); if (p) { n += CART[k].qty; t += CART[k].qty * p.harga; } });
  return { n: n, t: t };
}

function viewKatalog() {

  var r = recent();

    }).join('');
    app.innerHTML =
      '<div class="hero" style="padding-bottom:22px"><div class="between"><div class="row"><img class="logo" src="' + esc(logo()) + '" alt="Logo"><div class="kicker" style="color:var(--gold)">Pesanan Saya</div></div>' +
      '<button class="btn btn-sm" id="home" style="background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35)">Katalog</button></div>' +
      '<div class="serif" style="font-size:32px;font-weight:900;margin-top:12px">' + esc(o.no) + '</div><div style="color:#e8d6bd;font-size:16px">' + esc(o.nama) + ' · ' + esc(titleCase(o.trip)) + '</div></div>' +
      '<div class="pad stack" style="padding-bottom:40px">' +
      (batal ? '<div class="card" style="background:var(--red-soft);color:#8a2414"><div class="b" style="font-size:17px">Pesanan dibatalkan</div><div class="small">Hubungi admin jika ada pertanyaan.</div></div>' : '') +
      '<div class="card"><div class="lbl" style="margin-bottom:14px">Status Pesanan</div>' + tl + '</div>' +
      (perluBayar && !batal ? payBox(o.totalAkhir, T) +
        '<div class="card stack" id="upCard"><div class="lbl">Bukti Transfer</div>' +
        (o.adaBukti ? '<div style="background:var(--green-soft);color:#1a5a4e;border-radius:12px;padding:12px" class="b">Bukti sudah terkirim ✓ Menunggu dicek admin.</div>' : '') +
        '<label style="border:2px dashed #d8c7ae;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;cursor:pointer;color:#8a6420;text-align:center;padding:12px" id="drop">' + ICON.cam +
        '<span class="b" style="color:var(--ink);font-size:16px" id="dropTxt">' + (o.adaBukti ? 'Ganti foto bukti' : 'Foto / pilih gambar bukti transfer') + '</span><input type="file" accept="image/*" id="file" class="hidden"></label>' +
        '<img id="prev" class="hidden" style="border-radius:14px;max-height:320px;object-fit:contain;background:var(--bg2)" alt="Pratinjau bukti">' +
        '<button class="btn btn-dark" id="kirimBukti" disabled>Kirim Bukti Transfer</button></div>' : '') +
      (o.refund > 0 ? '<div class="card" style="background:var(--red-soft)"><div class="b" style="color:#8a2414;font-size:16px">Ada barang yang tidak tersedia</div><div class="small" style="color:#5a1a10">Dana ' + rp(o.refund) + ' akan dikembalikan via transfer. Admin akan menghubungi Anda.</div></div>' : '') +
      '<div class="card stack" style="gap:10px"><div class="lbl">Rincian</div>' + items +
      '<div class="between" style="border-top:1px dashed var(--line);padding-top:10px"><span class="b">Total</span><span style="font-size:22px" class="price">' + rp(o.totalAkhir) + '</span></div>' +
      (o.refund > 0 ? '<div class="small muted" style="text-align:right">Total awal ' + rp(o.total) + ' − refund ' + rp(o.refund) + '</div>' : '') +
      '<div class="between" style="background:var(--bg2);border-radius:10px;padding:12px;font-size:15px"><span>' + (ambil ? 'Pengambilan' : 'No. Resi') + '</span><span class="b">' + esc(ambil ? 'Ambil sendiri' : (o.resi || 'belum ada')) + '</span></div>' +
      (!ambil ? '<div class="small muted">' + esc(o.alamat) + '</div>' : '') +
      '<button class="btn btn-line" id="nota">' + ICON.dl + 'Lihat / Unduh ' + (st >= 2 ? 'Nota' : 'Invoice') + '</button></div>' +
      '<a class="btn btn-green" target="_blank" href="' + waLink(T.wa, 'Halo admin, saya mau tanya pesanan ' + o.no + ' a.n. ' + o.nama + '.') + '">' + ICON.wa + 'Tanya Admin via WhatsApp</a>' +
      '</div>';
    bindPayBox(T);
    $('#home').addEventListener('click', function () { (D && D.produk ? Promise.resolve() : loadKatalog()).then(viewKatalog); });
    $('#nota').addEventListener('click', function () { viewNota(token); });
    var f = $('#file');
    if (f) {
      var dataUrl = null;
      f.addEventListener('change', function () {
        if (!f.files[0]) return;
        readImage(f.files[0], 1400, 0.8).then(function (d) {
          dataUrl = d; $('#prev').src = d; $('#prev').classList.remove('hidden'); $('#dropTxt').textContent = 'Ganti foto'; $('#kirimBukti').disabled = false;
        }).catch(function (e) { toast(e.message, true); });
      });
      $('#kirimBukti').addEventListener('click', function () {
        if (!dataUrl) return;
        loading(true, 'Mengirim bukti…');
        api('apiUploadBukti', token, dataUrl).then(function () { loading(false); toast('Bukti terkirim. Terima kasih!'); viewPesanan(token); })
          .catch(function (e) { loading(false); toast(e.message, true); });
      });
      if (focusUpload) setTimeout(function () { $('#upCard').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 200);
    }
  }).catch(function (e) {
    app.innerHTML = '<div class="pad stack" style="padding-top:60px;text-align:center"><div class="h-title">Pesanan tidak ditemukan</div><div class="muted">' + esc(e.message) + '</div><button class="btn btn-dark" id="cek">Cari dengan No. Order</button></div>';
    $('#cek').addEventListener('click', viewCek);
  });
}

/* =================== NOTA =================== */
function viewNota(token) {
  scrollTop();
  app.innerHTML = '<div class="pad"><div class="skel" style="height:520px"></div></div>';
  api('apiPesanan', token).then(function (o) {
    var T = o.toko, lunas = stage(o) >= 2, batal = o.status === 'BATAL';
    var stamp = batal ? ['BATAL', 'var(--red)'] : lunas ? ['LUNAS', 'var(--green)'] : ['BELUM LUNAS', 'var(--red)'];
    var items = o.items.map(function (i) {
      return '<div class="between" style="padding:12px 0;border-top:1px solid #f1e7d8;font-size:15px;' + (i.tersedia ? '' : 'color:#9a8a7a') + '"><div class="col" style="gap:0"><b style="' + (i.tersedia ? '' : 'text-decoration:line-through') + '">' + esc(titleCase(i.nama)) + (i.isi ? ' ' + esc(titleCase(i.isi)) : '') + (i.varian ? ' · ' + esc(titleCase(i.varian)) : '') + '</b><span class="xs muted">' + i.qty + ' × ' + rpPlain(i.harga) + (i.tersedia ? '' : ' · tidak tersedia, refund') + '</span></div><span class="b">' + rpPlain(i.subtotal) + '</span></div>';
    }).join('');
    app.innerHTML = '<div class="pad stack" style="background:#efe8dc;min-height:100vh">' +
      '<div class="notacard" style="background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(43,26,16,.12)">' +
      '<div style="background:var(--ink);color:#fff;padding:20px" class="between"><div class="row"><img class="logo" style="width:50px;height:50px" src="' + esc(logo()) + '" alt="Logo"><div class="col" style="gap:0"><div class="serif" style="font-size:20px;font-weight:900">' + esc(titleCase(T.nama)) + '</div><div class="xs" style="color:#e8d6bd">' + esc(T.ig) + ' · ' + esc(T.wa) + '</div></div></div>' +
      '<div class="col" style="gap:0;align-items:flex-end"><div style="font-size:18px;font-weight:800;letter-spacing:2px;color:var(--gold)">' + (lunas ? 'NOTA' : 'INVOICE') + '</div><div class="small">' + esc(o.no) + '</div></div></div>' +
      '<div style="padding:20px;position:relative" class="stack">' +
      '<div style="align-self:flex-end;margin-bottom:-6px;transform:rotate(-6deg);border:3px solid ' + stamp[1] + ';color:' + stamp[1] + ';font-weight:900;font-size:19px;letter-spacing:3px;border-radius:8px;padding:4px 12px">' + stamp[0] + '</div>' +
      '<div class="col" style="gap:2px"><div class="kicker" style="font-size:12px">Kepada</div><div class="b" style="font-size:18px">' + esc(o.nama) + '</div><div class="small">' + esc(o.wa) + '</div></div>' +
      '<div class="small" style="color:#4f3c2e;margin-top:-8px">' + (o.cara === 'AMBIL' ? 'AMBIL SENDIRI' : esc(o.alamat)) + '</div>' +
      '<div class="xs muted" style="margin-top:-8px">' + esc(o.tanggal) + ' · ' + esc(titleCase(o.trip)) + '</div>' +
      '<div class="col" style="gap:0">' + items +
      (o.refund > 0 ? '<div class="between small" style="padding-top:10px;border-top:1px dashed var(--line)"><span>Total awal</span><span>' + rpPlain(o.total) + '</span></div><div class="between small" style="color:var(--red)"><span>Refund</span><span>− ' + rpPlain(o.refund) + '</span></div>' : '') +
      '<div class="between" style="padding-top:14px;border-top:2px solid var(--ink);margin-top:6px"><span class="b" style="font-size:16px">Total</span><span style="font-size:28px" class="price">' + rp(o.totalAkhir) + '</span></div><div class="xs muted" style="text-align:right">sudah termasuk ongkir</div></div>' +
      (lunas ? '<div style="background:var(--green-soft);color:#1a5a4e;border-radius:14px;padding:14px"><div class="kicker" style="color:#1a5a4e;font-size:12px">Pembayaran diterima</div><div class="b">' + esc(o.tglBayar) + '</div><div class="small">Terima kasih sudah titip di Koper Jastip!</div></div>' :
        batal ? '' : '<div style="background:var(--gold-soft);border:2px solid var(--gold);border-radius:14px;padding:14px" class="col"><div class="kicker" style="font-size:12px">Silakan transfer ke</div><div class="b" style="font-size:17px">' + esc(T.bank) + ' ' + esc(T.rek) + '</div><div class="small">a.n. ' + esc(T.an) + '</div><button class="btn btn-dark noprint" data-cprek style="height:50px;font-size:15px">' + ICON.copy + 'Salin No. Rekening</button></div>') +
      '</div></div>' +
      '<button class="btn btn-line noprint" id="pdf">' + ICON.dl + 'Unduh PDF</button>' +
      '<button class="btn btn-soft noprint" id="prt">' + ICON.print + 'Cetak</button>' +
      '<button class="btn btn-dark noprint" id="st">Lihat Status Pesanan</button></div>';
    bindPayBox(T);
    $('#pdf').addEventListener('click', function () {
      loading(true, 'Menyiapkan PDF…');
      api('apiNotaPdf', token).then(function (u) { loading(false); openUrl(u); }).catch(function (e) { loading(false); toast(e.message, true); });
    });
    $('#prt').addEventListener('click', function () { window.print(); });
    $('#st').addEventListener('click', function () { viewPesanan(token); });
  }).catch(function (e) { app.innerHTML = '<div class="pad"><div class="card errmsg">' + esc(e.message) + '</div></div>'; });
}

/* =================== CEK PESANAN =================== */
function viewCek() {
  scrollTop();
  var r = recent();
  app.innerHTML = '<div class="topbar"><button class="iconbtn" id="back" aria-label="Kembali">' + ICON.back + '</button><div class="serif" style="font-size:22px;font-weight:700">Cek Pesanan</div></div>' +
    '<div class="pad stack">' +
    (r.length ? '<div class="card col"><div class="kicker">Pesanan di HP ini</div>' + r.map(function (x) { return '<button class="opt" data-tok="' + esc(x.token) + '"><span class="b">' + esc(x.no) + '</span><span class="muted small">Lihat ›</span></button>'; }).join('') + '</div>' : '') +
    '<div class="card stack"><div class="field"><label class="lbl" for="no">Nomor Order</label><input class="inp" id="no" placeholder="KJ-0027" autocomplete="off"></div>' +
    '<div class="field"><label class="lbl" for="d4">4 angka terakhir nomor WA</label><input class="inp" id="d4" maxlength="4" placeholder="7890" style="letter-spacing:6px;font-size:22px"></div>' +
    '<div class="errmsg" id="err"></div><button class="btn btn-dark" id="go">Cari Pesanan</button></div></div>';
  bindUpper($('#no')); bindDigits($('#d4'));
  $('#back').addEventListener('click', function () { (D && D.produk ? Promise.resolve() : loadKatalog()).then(viewKatalog); });
  $$('[data-tok]').forEach(function (b) { b.addEventListener('click', function () { viewPesanan(b.getAttribute('data-tok')); }); });
  $('#go').addEventListener('click', function () {
    loading(true, 'Mencari…');
    api('apiCariPesanan', $('#no').value, $('#d4').value).then(function (tok) { loading(false); viewPesanan(tok); })
      .catch(function (e) { loading(false); $('#err').textContent = e.message; });
  });
}

/* =================== MULAI =================== */
(function start() {
  if (PARAMS.p === 'admin') return location.replace('admin.html' + location.search.replace(/[?&]p=admin/, '').replace(/^&/, '?'));
  if (PARAMS.p === 'cetak') return location.replace('cetak.html' + location.search);
  if (PARAMS.t) return viewPesanan(PARAMS.t);
  if (PARAMS.n) return viewNota(PARAMS.n);
  if (PARAMS.cek) return viewCek();
  loadKatalog().then(viewKatalog).catch(function (e) {
    app.innerHTML = '<div class="pad stack" style="padding-top:60px;text-align:center"><div class="h-title">Gagal memuat</div><div class="muted">' + esc(e.message) + '</div><button class="btn btn-dark" onclick="location.reload()">Coba Lagi</button></div>';
  });
})();
</script>
</body>
</html>
