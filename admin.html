function _mk(ok,fail){return new Proxy({},{get:function(_,k){if(k==='withSuccessHandler')return function(f){return _mk(f,fail);};if(k==='withFailureHandler')return function(f){return _mk(ok,f);};
return function(){var a=Array.prototype.slice.call(arguments);_call(k,a).then(function(j){if(j.error){fail&&fail(new Error(j.error));}else{ok&&ok(j.result);}}).catch(function(){fail&&fail(new Error('Koneksi gagal. Periksa internet lalu coba lagi.'));});};}});}

<style>
:root{
  --bg:#fbf7f0; --bg2:#f4ece0; --card:#ffffff; --ink:#2b1a10; --muted:#6b5444; --line:#e6d9c6;
  --gold:#e9a82b; --gold-soft:#fdf3df; --red:#b8321c; --red-soft:#fbe3dd; --green:#1f6b5c; --green-soft:#e5f2ee;
  --blue:#22476f; --blue-soft:#e2ecf6; --shadow:0 6px 20px rgba(43,26,16,.09); --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;font-size:16px;line-height:1.45}
body{min-height:100vh}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
a{color:var(--red)}
.serif{font-family:'Playfair Display',Georgia,serif}
.wrap{max-width:560px;margin:0 auto;position:relative;min-height:100vh}
.wide .wrap{max-width:980px}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}.xs{font-size:13px}
.b{font-weight:700}.xb{font-weight:800}
.price{color:var(--red);font-weight:800}
.pad{padding:18px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.kicker{font-size:13px;font-weight:700;letter-spacing:2px;color:#8a6420;text-transform:uppercase}
h1,h2,h3{margin:0}
.h-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700}

/* buttons */
.btn{height:58px;border-radius:16px;border:none;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 20px;text-decoration:none;width:100%;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-dark{background:var(--ink);color:#fff}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-green{background:var(--green);color:#fff}
.btn-line{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn-soft{background:var(--bg2);color:var(--ink)}
.btn-sm{height:44px;font-size:15px;border-radius:12px;width:auto;padding:0 16px}
.iconbtn{width:48px;height:48px;border-radius:50%;border:none;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex:none}

/* form */
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.lbl{font-size:16px;font-weight:700}
.inp{height:58px;border:1.5px solid var(--line);border-radius:14px;padding:0 16px;font-size:18px;background:#fff;width:100%;outline:none;transition:border .15s,box-shadow .15s}
textarea.inp{height:auto;min-height:100px;padding:14px 16px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(233,168,43,.25)}
.inp.err{border-color:var(--red);box-shadow:0 0 0 4px rgba(184,50,28,.12)}
.upper{text-transform:uppercase}
input[type=search]::-webkit-search-cancel-button{display:none}
input::placeholder,textarea::placeholder{text-transform:none;color:#a89886}
.hint{font-size:14px;color:var(--muted)}
.errmsg{font-size:14px;color:var(--red);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{height:64px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:17px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.picker{height:58px;border:1.5px solid var(--line);border-radius:14px;padding:0 16px;font-size:17px;background:#fff;width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left}
.picker.empty{color:#9a8a7a}
.picker[disabled]{background:#f7f2ea;border-style:dashed;color:#b0a090}
.picker .ph{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;border-radius:21px;border:1.5px solid var(--line);background:#fff;padding:0 16px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.badge{display:inline-flex;align-items:center;border-radius:12px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}

/* stepper */
.stepper{display:flex;align-items:center;gap:4px;background:var(--bg2);border-radius:30px;padding:4px}
.stepper button{width:48px;height:48px;border-radius:50%;border:none;background:#fff;font-size:24px;font-weight:700;line-height:1}
.stepper button.plus{background:var(--ink);color:#fff}
.stepper .q{min-width:34px;text-align:center;font-size:20px;font-weight:800}

/* sheet / modal */
.sheet-bg{position:fixed;inset:0;background:rgba(30,18,10,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
.sheet-head{padding:16px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f1e7d8}
.sheet-body{overflow:auto;padding:12px 18px 24px}
.opt{width:100%;text-align:left;padding:16px 14px;font-size:17px;border:none;background:#fff;border-bottom:1px solid #f3eadc;display:flex;justify-content:space-between;gap:10px}
.opt:active,.opt:hover{background:var(--gold-soft)}
.opt mark{background:none;color:inherit;text-decoration:underline;font-weight:800}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* toast & loader */
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 20px;border-radius:14px;font-size:15px;font-weight:600;z-index:90;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.err{background:var(--red)}
.loading{position:fixed;inset:0;background:rgba(251,247,240,.75);z-index:80;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-weight:700}
.spin{width:44px;height:44px;border:4px solid var(--bg2);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#efe6d8 25%,#f7f1e7 50%,#efe6d8 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:20px}
@keyframes sk{to{background-position:-200% 0}}

/* header */
.hero{background:var(--ink);color:#fff;padding:18px 20px 26px;border-radius:0 0 28px 28px}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #efe4d3;padding:14px 18px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff}

/* timeline */
.tl{display:flex;gap:14px}
.tl .dotcol{display:flex;flex-direction:column;align-items:center}
.tl .dot{width:28px;height:28px;border-radius:50%;border:3px solid #d8c7ae;background:#fff;flex:none}
.tl .dot.done{background:var(--green);border-color:var(--green)}
.tl .dot.now{background:var(--gold);border-color:var(--gold)}
.tl .line{width:3px;flex:1;min-height:26px;background:#e6dccd}
.tl .line.done{background:var(--green)}

@media (min-width:700px){
  .h-title{font-size:30px}
}
</style>

<style>
body{background:#f6f1e8}
.ahead{background:var(--ink);color:#fff;padding:14px 18px 16px;position:sticky;top:0;z-index:25}
.tripsel{height:48px;border-radius:14px;background:rgba(255,255,255,.1);color:#fff;border:none;padding:0 14px;font-weight:700;font-size:16px;width:100%;display:flex;align-items:center;justify-content:space-between}

.switch{width:56px;height:32px;border-radius:16px;background:#d8cbb8;position:relative;border:none;flex:none;transition:background .15s}

.prow{display:flex;gap:12px;padding:12px;background:#fff;border-radius:18px;box-shadow:var(--shadow);align-items:center}

</style>

<script>
/* ---------- panggil server ---------- */
function api(name) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) {
      rej(new Error(String((e && e.message) || e).replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '')));
    });
    r[name].apply(r, args);
  });
}

/* ---------- util ---------- */
function $(s, el) { return (el || document).querySelector(s); }
function $$(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function rp(n) { return 'Rp' + String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function rpPlain(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function wa62(d) { return '62' + String(d || '').replace(/\D/g, '').replace(/^0/, ''); }
function waLink(no, text) { return 'https://wa.me/' + wa62(no) + (text ? '?text=' + encodeURIComponent(text) : ''); }
function openUrl(u) { var w = window.open(u, '_blank'); if (!w) window.top.location.href = u; }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('kj_' + k)); localStorage.setItem('kj_' + k, JSON.stringify(v)); } catch (e) { return null; } }

var toastT;
function toast(msg, isErr) {
  var t = $('#toast'); t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(function () { t.className = ''; }, isErr ? 4200 : 2600);
}
function loading(on, text) {
  var el = $('#loadingBox');
  if (on) {
    if (!el) { el = document.createElement('div'); el.id = 'loadingBox'; el.className = 'loading'; document.body.appendChild(el); }
    el.innerHTML = '<div class="spin"></div><div>' + esc(text || 'Mohon tunggu…') + '</div>';
  } else if (el) el.remove();
}
function copyText(t) {
  function fb() {
    var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(fb); else fb();
  toast('Tersalin ✓');
}

/* ---------- input rapi: kapital & angka ---------- */
function bindUpper(el) {
  el.classList.add('upper');
  el.addEventListener('input', function () {
    var s = el.selectionStart, e = el.selectionEnd, v = el.value.toUpperCase();
    if (v !== el.value) { el.value = v; try { el.setSelectionRange(s, e); } catch (x) {} }
  });
}
function bindDigits(el, onBad) {
  el.setAttribute('inputmode', 'numeric');
  el.addEventListener('input', function () {
    var v = el.value, d = v.replace(/\D/g, '');
    if (v !== d) { el.value = d; if (onBad) onBad(); }
  });
}
function bindRupiah(el) {
  el.setAttribute('inputmode', 'numeric');
  el.addEventListener('input', function () {
    var d = el.value.replace(/\D/g, '');
    el.value = d ? rpPlain(d) : '';
  });
}
function digits(v) { return Number(String(v || '').replace(/\D/g, '')) || 0; }
function normWa(v) {
  var d = String(v || '').replace(/\D/g, '');
  if (d.indexOf('62') === 0) d = '0' + d.slice(2); else if (d.indexOf('8') === 0) d = '0' + d;
  return /^08\d{8,11}$/.test(d) ? d : '';
}

/* ---------- foto: perkecil sebelum upload ---------- */
function readImage(file, maxSide, quality) {
  return new Promise(function (res, rej) {
    if (!file) return rej(new Error('Tidak ada file'));
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, (maxSide || 1200) / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', quality || 0.82));
      };
      img.onerror = function () { rej(new Error('Gambar tidak bisa dibaca')); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- bottom sheet pencarian ---------- */
function searchSheet(opts) {
  // opts: {title, items:[{value,label,sub}], loader:Promise, onPick, placeholder}
  var bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" role="dialog" aria-label="' + esc(opts.title) + '">' +
    '<div class="sheet-head"><div class="grow"><div class="kicker">Pilih</div><div class="h-title" style="font-size:22px">' + esc(opts.title) + '</div></div>' +
    '<button class="iconbtn" aria-label="Tutup" data-x>' + ICON.x + '</button></div>' +
    '<div style="padding:12px 18px 6px"><input class="inp" type="search" autocomplete="off" placeholder="' + esc(opts.placeholder || 'Ketik untuk mencari…') + '"></div>' +
    '<div class="sheet-body" style="padding-top:0"><div class="list"><div class="pad muted">Memuat…</div></div></div></div>';
  document.body.appendChild(bg);
  var inp = $('input', bg), list = $('.list', bg), items = [];
  function close() { bg.remove(); }
  bg.addEventListener('click', function (e) { if (e.target === bg || e.target.closest('[data-x]')) close(); });
  function render() {
    var q = inp.value.trim().toUpperCase();
    var f = items.filter(function (it) { return !q || it.label.toUpperCase().indexOf(q) >= 0; });
    f.sort(function (a, b) {
      var A = a.label.toUpperCase().indexOf(q) === 0 ? 0 : 1, B = b.label.toUpperCase().indexOf(q) === 0 ? 0 : 1; return A - B;
    });
    if (!f.length) { list.innerHTML = '<div class="pad muted">Tidak ditemukan. Coba ketik kata lain.</div>'; return; }
    list.innerHTML = f.slice(0, 300).map(function (it, i) {
      var L = esc(it.label);
      if (q) { var k = it.label.toUpperCase().indexOf(q); if (k >= 0) L = esc(it.label.slice(0, k)) + '<mark>' + esc(it.label.slice(k, k + q.length)) + '</mark>' + esc(it.label.slice(k + q.length)); }
      return '<button class="opt" data-i="' + items.indexOf(it) + '"><span>' + L + '</span>' + (it.sub ? '<span class="muted small">' + esc(it.sub) + '</span>' : '') + '</button>';
    }).join('');
  }
  inp.addEventListener('input', render);
  list.addEventListener('click', function (e) {
    var b = e.target.closest('.opt'); if (!b) return;
    close(); opts.onPick(items[Number(b.getAttribute('data-i'))]);
  });
  bindUpper(inp);
  Promise.resolve(opts.loader || opts.items).then(function (r) { items = r || []; render(); setTimeout(function () { inp.focus(); }, 60); })
    .catch(function (e) { list.innerHTML = '<div class="pad errmsg">' + esc(e.message) + '</div>'; });
}

/* ---------- pemilih wilayah bertingkat ---------- */
var WIL_CACHE = {};
function wilayah(induk) {
  var k = induk || 'ROOT';
  if (!WIL_CACHE[k]) WIL_CACHE[k] = api('apiWilayah', induk || '').then(function (r) {
    return r.map(function (x) { return { value: x[0], label: x[1], kodepos: x[2] }; });
  }).catch(function (e) { delete WIL_CACHE[k]; throw e; });
  return WIL_CACHE[k];
}
function WilayahPicker(host, initial) {
  var LV = [['prov', 'Provinsi'], ['kota', 'Kota / Kabupaten'], ['kec', 'Kecamatan'], ['kel', 'Kelurahan / Desa']];
  var st = { prov: null, kota: null, kec: null, kel: null, detail: '' };
  if (initial) LV.forEach(function (l) { if (initial[l[0]]) st[l[0]] = { label: initial[l[0]], value: null }; });
  if (initial) { st.detail = initial.detail || ''; st.kodepos = initial.kodepos || ''; }
  host.innerHTML = LV.map(function (l, i) {
    return '<div class="field"><div class="lbl">' + (i + 1) + '. ' + l[1] + '</div><button type="button" class="picker" data-lv="' + l[0] + '"><span class="ph"></span>' + ICON.down + '</button></div>';
  }).join('') +
    '<div class="between" style="background:var(--bg2);border-radius:12px;padding:12px 16px"><span class="b">Kode Pos</span><span class="xb kp" style="font-size:18px"></span></div>' +
    '<div class="field"><label class="lbl">5. Alamat Detail</label><textarea class="inp det" rows="3" placeholder="NAMA JALAN, NO. RUMAH, RT/RW, PATOKAN"></textarea><div class="hint">Contoh: JL. MAWAR NO. 12, RT 03/RW 05, DEKAT MASJID</div></div>';
  var det = $('.det', host); det.value = st.detail; bindUpper(det);
  det.addEventListener('input', function () { st.detail = det.value; });
  function parentOf(i) { return i === 0 ? '' : (st[LV[i - 1][0]] || {}).value; }
  function paint() {
    LV.forEach(function (l, i) {
      var b = $('[data-lv="' + l[0] + '"]', host), v = st[l[0]];
      var enabled = i === 0 || (st[LV[i - 1][0]] && (st[LV[i - 1][0]].value || v));
      b.disabled = !enabled;
      b.classList.toggle('empty', !v);
      $('.ph', b).textContent = v ? v.label : (enabled ? 'Ketuk untuk pilih' : 'Pilih ' + LV[i - 1][1].toLowerCase() + ' dulu');
    });
    $('.kp', host).textContent = st.kodepos || 'otomatis';
    $('.kp', host).style.color = st.kodepos ? 'var(--ink)' : '#9a8a7a';
  }
  host.addEventListener('click', function (e) {

  };
}

function logout(silent) {

}

/* =================== SHELL =================== */
function init() {
  loading(true, 'Memuat…');
  return A('apiAdminInit').then(function (r) {
    loading(false);
    S.admin = r.admin; S.trips = r.trips; S.settings = r.settings;
    if (!S.trips.some(function (t) { return t.id === S.tripId; })) {
      var open = S.trips.filter(function (t) { return t.status === 'BUKA'; })[0];
      S.tripId = (open || S.trips[S.trips.length - 1] || {}).id || ''; store('tripId', S.tripId);
    }
    if (window.innerWidth >= 900) document.body.classList.add('wide');
    go(PARAMS.o ? 'order' : 'home');
    if (PARAMS.o) { openOrder(PARAMS.o); PARAMS.o = null; }
  }).catch(function (e) { loading(false); if (!/Sesi/.test(e.message)) toast(e.message, true); });
}
var NAVS = [
  ['home', 'Ringkasan', '<path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-3H4z"/>'],
  ['order', 'Order', '<path d="M6 6h15l-2 9H8L6 3H3"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>'],
  ['produk', 'Produk', '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>'],
  ['lain', 'Lainnya', '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>']
];
function shell(title, body, opts) {
  opts = opts || {};
  var t = trip();
  app.innerHTML = '<div class="ahead"><div class="between" style="margin-bottom:10px"><div class="col" style="gap:0"><div class="xs" style="color:#e8d6bd">Halo, ' + esc(S.admin) + '</div><div class="serif" style="font-size:23px;font-weight:900">' + esc(title) + '</div></div>' +
    (t.id ? '<span class="badge" style="background:' + (t.status === 'BUKA' ? 'var(--green)' : '#6b5444') + ';color:#fff">TRIP ' + esc(t.status) + '</span>' : '') + '</div>' +
    '<button class="tripsel" id="tripBtn"><span>' + esc(titleCase(t.nama || 'Belum ada trip')) + '</span><span style="color:var(--gold)">Ganti ▾</span></button></div>' +
    '<div id="body" class="pad stack" style="padding-bottom:110px">' + body + '</div>' +
    '<nav class="nav">' + NAVS.map(function (n) {
      return '<button data-nav="' + n[0] + '" class="' + (S.tab === n[0] ? 'on' : '') + '"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8a7a6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + n[2] + '</svg>' + n[1] + '</button>';
    }).join('') + '</nav>';
  $$('[data-nav]').forEach(function (b) { b.addEventListener('click', function () { go(b.getAttribute('data-nav')); }); });
  $('#tripBtn').addEventListener('click', function () {
    searchSheet({
      title: 'Trip', items: S.trips.slice().reverse().map(function (x) { return { value: x.id, label: x.nama, sub: x.status }; }),
      onPick: function (it) { S.tripId = it.value; store('tripId', it.value); go(S.tab); }
    });
  });
}
function go(tab) {
  S.tab = tab; window.scrollTo(0, 0);
  if (tab === 'home') return viewHome();
  if (tab === 'order') return viewOrders();
  if (tab === 'produk') return viewProduk();
  return viewLain();
}
function sub(title, body, back) {
  window.scrollTo(0, 0);
  app.innerHTML = '<div class="topbar"><button class="iconbtn" id="back" aria-label="Kembali">' + ICON.back + '</button><div class="serif grow" style="font-size:22px;font-weight:700">' + title + '</div></div><div class="pad stack" id="body" style="padding-bottom:60px">' + body + '</div>';
  $('#back').addEventListener('click', back || function () { go(S.tab); });
}

/* =================== RINGKASAN =================== */

  if (!S.tripId) { $('#body').innerHTML = '<div class="card stack"><div class="b">Belum ada trip.</div><button class="btn btn-dark" onclick="go(\'lain\')">Buat Trip</button></div>'; return; }
  A('apiDashboard', S.tripId).then(function (d) {
    var link = BASE;
    var st = d.status || {};
    var chip = function (s) { return st[s] ? '<button class="chip" data-f="' + s + '" style="border:none;background:' + STC[s][0] + ';color:' + STC[s][1] + '">' + titleCase(s) + ' · ' + st[s] + '</button>' : ''; };
    var maxQ = Math.max.apply(null, d.belanja.map(function (b) { return b.qty; }).concat([1]));

      '<div class="stat" data-f="CEK BUKTI" style="cursor:pointer"><div class="k">CEK BAYAR</div><div class="v" style="color:var(--red)">' + (st['CEK BUKTI'] || 0) + ' bukti</div><div class="xs muted">' + (st['MENUNGGU BAYAR'] || 0) + ' belum bayar</div></div>' +
      '<div class="stat"><div class="k">REFUND</div><div class="v">' + short(d.refund) + '</div><div class="xs muted">' + (d.refundBelumRek ? d.refundBelumRek + ' belum ada rekening' : 'sudah sudah beres') .replace('sudah sudah', 'semua') + '</div></div></div>' +
      '<div class="dash2"><div class="stack">' +
      '<div class="card stack" style="gap:12px"><div class="between"><div class="serif" style="font-size:20px;font-weight:700">Status Order</div><button class="btn btn-sm btn-soft" id="addO">' + ICON.plus + 'Input</button></div>' +
      '<div class="chips">' + Object.keys(STC).map(chip).join('') + (d.order ? '' : '<span class="muted">Belum ada order.</span>') + '</div></div>' +
      '<div class="card stack" style="gap:12px"><div class="serif" style="font-size:20px;font-weight:700">Link untuk Customer</div>' +
      '<div class="small muted">Bagikan di IG, WA, atau brosur.</div>' +
      '<div class="between" style="background:var(--bg2);border-radius:12px;padding:10px 12px"><span class="small b" style="word-break:break-all">' + esc(link) + '</span></div>' +
      '<div class="acts"><button class="btn btn-dark btn-sm" style="width:100%" id="cpLink">' + ICON.copy + 'Salin Link</button><button class="btn btn-line btn-sm" style="width:100%" id="qr">QR Code</button></div>' +
      '<div id="qrBox" class="hidden" style="align-self:center;background:#fff;padding:12px;border-radius:12px"></div></div></div>' +
      '<div class="card stack" style="gap:14px"><div class="between"><div class="serif" style="font-size:20px;font-weight:700">Daftar Belanja</div>' + (d.belanja.length ? '<button class="btn btn-sm btn-soft" id="cpB">' + ICON.copy + 'Salin</button>' : '') + '</div>' +
      '<div class="xs muted" style="margin-top:-8px">Total yang harus dibeli (order tidak batal) · modal ' + rp(d.modal) + '</div>' +
      (d.belanja.length ? d.belanja.map(function (b) {
        return '<div class="col" style="gap:6px"><div class="between" style="font-size:15px"><span class="b">' + esc(titleCase(b.nama)) + '<span class="xs muted" style="font-weight:500"> · ' + esc(titleCase(b.toko)) + '</span></span><span class="xb" style="font-size:18px">' + b.qty + '</span></div><div class="bar"><div style="width:' + Math.round(b.qty / maxQ * 100) + '%"></div></div></div>';
      }).join('') : '<div class="muted">Belum ada pesanan.</div>') + '</div></div>';
    $$('[data-f]').forEach(function (b) { b.addEventListener('click', function () { S.filter = b.getAttribute('data-f'); go('order'); }); });
    $('#addO').addEventListener('click', viewInputOrder);

    });
  }).catch(function (e) { toast(e.message, true); });
}

/* =================== ORDER =================== */
var ORDERS = [];
function viewOrders() {
  var filters = ['SEMUA'].concat(Object.keys(STC));
  shell('Order',
    '<div class="searchbox" style="position:relative">' + ICON.search.replace('<svg', '<svg style="position:absolute;left:16px;top:18px;color:var(--muted)"') +
    '<input class="inp" id="q" type="search" placeholder="Cari nama, WA, no. order, produk" style="padding-left:50px;border-radius:30px" value="' + esc(S.q) + '"></div>' +
    '<div class="chips" style="flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px">' + filters.map(function (f) { return '<button class="chip ' + (S.filter === f ? 'on' : '') + '" data-flt="' + f + '" style="flex:none">' + titleCase(f) + '</button>'; }).join('') + '</div>' +
    '<div class="acts"><button class="btn btn-dark btn-sm" style="width:100%" id="add">' + ICON.plus + 'Input Order</button><button class="btn btn-line btn-sm" style="width:100%" id="selm">' + (S.selMode ? 'Batal Pilih' : 'Cetak Label') + '</button></div>' +
    '<div id="olist"><div class="skel" style="height:300px"></div></div>' +
    '<div id="selbar"></div>');
  $('#q').addEventListener('input', function () { S.q = this.value; renderOrders(); });
  bindUpper($('#q'));
  $$('[data-flt]').forEach(function (b) { b.addEventListener('click', function () { S.filter = b.getAttribute('data-flt'); $$('[data-flt]').forEach(function (x) { x.classList.toggle('on', x === b); }); renderOrders(); }); });
  $('#add').addEventListener('click', viewInputOrder);
  $('#selm').addEventListener('click', function () { S.selMode = !S.selMode; S.sel = {}; viewOrders(); });
  A('apiListOrder', S.tripId).then(function (r) { ORDERS = r; renderOrders(); }).catch(function (e) { toast(e.message, true); });
}
function renderOrders() {
  var q = S.q.trim().toUpperCase();
  var list = ORDERS.filter(function (o) {
    if (S.filter !== 'SEMUA' && o.status !== S.filter) return false;
    if (!q) return true;
    return (o.no + ' ' + o.nama + ' ' + o.wa + ' ' + o.isi).toUpperCase().indexOf(q) >= 0;
  });
  $('#olist').innerHTML = list.length ? '<div class="olist">' + list.map(function (o) {
    return '<button class="orow" data-no="' + esc(o.no) + '">' + (S.selMode ? '<span class="cbx ' + (S.sel[o.no] ? 'on' : '') + '">' + (S.sel[o.no] ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"><path d="M5 12l5 5L19 7"/></svg>' : '') + '</span>' : '') +
      '<div class="grow col" style="gap:2px"><div class="between"><span class="b" style="font-size:16px">' + esc(o.nama) + '</span><span class="xb">' + rp(o.total) + '</span></div>' +
      '<div class="between"><span class="xs muted">' + esc(o.no) + ' · ' + esc(o.tanggal) + ' · ' + (o.cara === 'AMBIL' ? 'Ambil' : 'Kirim') + '</span>' + badge(o.status) + '</div>' +
      '<div class="xs muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(o.isi) + '</div></div></button>';
  }).join('') + '</div>' : '<div class="card muted" style="text-align:center">Tidak ada order.</div>';
  $$('.orow').forEach(function (b) {
    b.addEventListener('click', function () {
      var no = b.getAttribute('data-no');
      if (S.selMode) { if (S.sel[no]) delete S.sel[no]; else S.sel[no] = 1; renderOrders(); }
      else openOrder(no);
    });
  });
  var n = Object.keys(S.sel).length, sb = $('#selbar');
  sb.innerHTML = S.selMode ? '<div class="cartbar" style="position:fixed;left:50%;transform:translateX(-50%);bottom:84px;width:calc(100% - 24px);max-width:536px;background:var(--ink);color:#fff;border-radius:20px;padding:12px 12px 12px 18px;display:flex;align-items:center;justify-content:space-between;z-index:31">' +
    '<span class="b">' + n + ' order dipilih</span><div class="row"><button class="btn btn-sm" style="background:rgba(255,255,255,.12);color:#fff" id="selAll">Semua</button><button class="btn btn-gold btn-sm" id="prtL" ' + (n ? '' : 'disabled') + '>' + ICON.print + 'Label</button></div></div>' : '';
  if (S.selMode) {
    $('#selAll').addEventListener('click', function () { list.forEach(function (o) { if (o.cara !== 'AMBIL' && o.status !== 'BATAL') S.sel[o.no] = 1; }); renderOrders(); });
    $('#prtL').addEventListener('click', function () { openUrl(BASE + 'cetak.html?p=cetak&j=label&s=' + encodeURIComponent(S.sesi) + '&nos=' + encodeURIComponent(Object.keys(S.sel).join(','))); });
  }
}

/* ---------- detail order ---------- */
var CUR = null;
function waMsg(kind, o) {
  var T = S.settings, nm = o.nama, link = BASE + '?t=' + o.token, nota = BASE + '?n=' + o.token;
  var head = 'Halo ' + titleCase(nm) + ' 🙏\n';
  if (kind === 'invoice') return head + 'Terima kasih sudah order di Koper Jastip.\n\nNo. Order: ' + o.no + '\nTotal: ' + rp(o.totalAkhir) + '\n\nSilakan transfer ke ' + T.BANK + ' ' + T.NO_REKENING + ' a.n. ' + T.ATAS_NAMA + '\nlalu upload bukti transfer di sini:\n' + link + '\n\nInvoice: ' + nota;
  if (kind === 'lunas') return head + 'Pembayaran pesanan ' + o.no + ' sebesar ' + rp(o.totalAkhir) + ' sudah kami terima ✓\n\nNota lunas: ' + nota + '\nCek status pesanan: ' + link + '\n\nTerima kasih sudah titip di Koper Jastip!';
  if (kind === 'dibeli') return head + 'Kabar baik! Pesanan ' + o.no + ' sudah kami belikan ✓\nKami kabari lagi saat ' + (o.cara === 'AMBIL' ? 'siap diambil' : 'dikirim') + '.\n\nCek status: ' + link;
  if (kind === 'kirim') return head + 'Pesanan ' + o.no + ' sudah dikirim 🚚' + (o.resi ? '\nNo. resi: ' + o.resi : '') + '\n\nCek status: ' + link + '\nTerima kasih!';
  if (kind === 'ambil') return head + 'Pesanan ' + o.no + ' sudah siap diambil 🎁\nMohon konfirmasi waktu pengambilan ya.\n\nDetail: ' + link;
  if (kind === 'refund') {
    var gone = o.items.filter(function (i) { return !i.tersedia; }).map(function (i) { return '• ' + titleCase(i.nama) + (i.varian ? ' (' + titleCase(i.varian) + ')' : '') + ' ×' + i.qty; }).join('\n');
    return head + 'Mohon maaf, barang berikut tidak tersedia di lokasi:\n' + gone + '\n\nDana ' + rp(o.refund) + ' akan kami kembalikan via transfer.\nMohon kirim nama bank, no. rekening & nama pemilik rekening ya.\n\nDetail: ' + link;
  }
  return head;
}
function openOrder(no) {
  sub(esc(no), '<div class="skel" style="height:500px"></div>', function () { go('order'); });

}

          var k = p.id + '|' + v, q2 = F.cart[k] ? F.cart[k].qty : 0;
          return '<div class="between" style="padding:10px 0;border-bottom:1px solid #f3eadc"><div class="col grow" style="gap:0"><span class="b" style="font-size:15px">' + esc(titleCase(p.nama)) + (v ? ' · ' + esc(titleCase(v)) : '') + '</span><span class="xs muted">' + rp(p.harga) + (p.sisa != null ? ' · sisa ' + p.sisa : '') + (p.aktif ? '' : ' · disembunyikan') + '</span></div>' +

        }).join('');

          c.qty = Math.max(0, c.qty + Number(b.getAttribute('data-d')));

        .catch(function (e) { loading(false); toast(e.message, true); });
    });
  }).catch(function (e) { toast(e.message, true); });
}

    '<div class="card stack"><div class="serif" style="font-size:20px;font-weight:700">Info Toko</div>' +
    [['BANK', 'Bank'], ['NO_REKENING', 'No. Rekening'], ['ATAS_NAMA', 'Atas Nama'], ['WA_ADMIN', 'No. WA Admin'], ['INSTAGRAM', 'Instagram'], ['EMAIL_NOTIF', 'Email Notifikasi']].map(function (f) {
      return '<div class="field"><label class="lbl" style="font-size:14px" for="s_' + f[0] + '">' + f[1] + '</label><input class="inp" id="s_' + f[0] + '" value="' + esc(st[f[0]] || '') + '" style="height:52px;font-size:16px"></div>';
    }).join('') + '<button class="btn btn-dark" id="saveSet">Simpan Info Toko</button></div>' +
    '<div class="card stack"><div class="serif" style="font-size:20px;font-weight:700">Ganti Password</div><div class="small muted">Untuk ' + esc(S.admin) + '</div>' +
    '<input class="inp" id="pwOld" type="password" placeholder="Password lama"><input class="inp" id="pwNew" type="password" placeholder="Password baru (min. 4)">' +
    '<button class="btn btn-line" id="savePw">Ganti Password</button></div>' +
    '<button class="btn btn-soft" id="out">Keluar</button>');
  $('#newTrip').addEventListener('click', function () { formTrip(null); });
  $$('[data-trip]').forEach(function (b) { b.addEventListener('click', function () { formTrip(S.trips.filter(function (t) { return t.id === b.getAttribute('data-trip'); })[0]); }); });
  bindDigits($('#s_WA_ADMIN')); bindDigits($('#s_NO_REKENING'));
  $('#saveSet').addEventListener('click', function () {
    var o = {}; ['BANK', 'NO_REKENING', 'ATAS_NAMA', 'WA_ADMIN', 'INSTAGRAM', 'EMAIL_NOTIF'].forEach(function (k) { o[k] = $('#s_' + k).value; });
    loading(true); A('apiSimpanPengaturan', o).then(function (r) { loading(false); S.settings = r.settings; toast('Tersimpan ✓'); }).catch(function (e) { loading(false); toast(e.message, true); });
  });
  $('#savePw').addEventListener('click', function () {
    loading(true); A('apiGantiPassword', $('#pwOld').value, $('#pwNew').value).then(function () { loading(false); toast('Password diganti ✓'); $('#pwOld').value = $('#pwNew').value = ''; }).catch(function (e) { loading(false); toast(e.message, true); });
  });
  $('#out').addEventListener('click', function () { if (confirm('Keluar dari admin?')) logout(); });
}
function formTrip(t) {
  sub(t ? 'Ubah Trip' : 'Trip Baru',
    '<div class="card stack"><div class="field"><label class="lbl" for="tn">Nama Trip</label><input class="inp" id="tn" value="' + esc(t ? t.nama : '') + '" placeholder="MIS. JASTIP MEDAN OKT 2026"></div>' +
    '<div class="field"><label class="lbl" for="tb">Batas Order <span class="muted" style="font-weight:500">(opsional)</span></label><input class="inp" id="tb" type="datetime-local" value="' + esc(t ? t.batas : '') + '"><div class="hint">Form otomatis tutup di waktu ini.</div></div>' +
    '<div class="lbl">Status</div><div class="seg" id="ts"><button data-s="BUKA" class="' + (!t || t.status === 'BUKA' ? 'on' : '') + '">Buka</button><button data-s="TUTUP" class="' + (t && t.status === 'TUTUP' ? 'on' : '') + '">Tutup</button></div>' +
    '<div class="xs muted">Membuka trip ini akan menutup trip lain yang sedang buka.</div></div>' +
    '<button class="btn btn-dark" id="save">Simpan Trip</button>', function () { go('lain'); });
  bindUpper($('#tn'));
  var status = !t || t.status === 'BUKA' ? 'BUKA' : 'TUTUP';
  $$('#ts button').forEach(function (b) { b.addEventListener('click', function () { status = b.getAttribute('data-s'); $$('#ts button').forEach(function (x) { x.classList.toggle('on', x === b); }); }); });
  $('#save').addEventListener('click', function () {
    loading(true);
    A('apiSimpanTrip', { id: t ? t.id : null, nama: $('#tn').value, batas: $('#tb').value, status: status }).then(function (r) {
      loading(false); S.trips = r.trips;
      if (!t) { S.tripId = r.trips[r.trips.length - 1].id; store('tripId', S.tripId); }
      toast('Trip tersimpan ✓'); go('lain');
    }).catch(function (e) { loading(false); toast(e.message, true); });
  });
}

/* =================== MULAI =================== */
if (S.sesi) init(); else viewLogin();
</script>
